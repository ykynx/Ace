:root{--void:#0a0a0d;--panel:#121217;--line:rgba(242,240,234,.09);--ink:#f2f0ea;--muted:#908e83;--gold:#d4a350;--gold2:#f0c274;--ease:cubic-bezier(.16,1,.3,1);--pad:clamp(20px,6vw,88px);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));background:var(--void)}
body{background:var(--void);color:var(--ink);font:400 1rem/1.6 Inter,system-ui,"Segoe UI","Noto Sans",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:6px}
h1,h2,h3,.logo{font-family:'Space Grotesk',Inter,system-ui,sans-serif}
[lang=ar] *{letter-spacing:0!important}

.nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:20px var(--pad);border-bottom:1px solid transparent;transition:background .4s,padding .4s,border-color .4s}
.nav.scrolled{background:rgba(10,10,13,.72);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding-top:12px;padding-bottom:12px;border-color:var(--line)}
.logo{font-weight:700;font-size:1.35rem;letter-spacing:-.01em}
.rt{display:flex;align-items:center;gap:1.4rem}
.menu{display:flex;gap:2rem;list-style:none;align-items:center}
.menu a{position:relative;color:var(--muted);font-size:.92rem;transition:color .3s}
.menu a::after{content:"";position:absolute;left:0;bottom:-5px;height:1px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.menu a:hover,.menu a.on{color:var(--ink)}
.menu a:hover::after,.menu a.on::after{transform:scaleX(1)}
.burger{display:none;background:none;border:0;color:var(--ink);width:44px;height:44px;cursor:pointer}
.lang{position:relative}
#lb{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:7px 12px;font:500 .8rem Inter,system-ui,sans-serif;cursor:pointer;transition:.3s}

#lmenu{position:absolute;top:calc(100% + 10px);inset-inline-end:0;display:grid;grid-template-columns:1fr 1fr;gap:2px;min-width:250px;padding:8px;list-style:none;background:rgba(18,18,23,.97);border:1px solid var(--line);border-radius:16px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);opacity:0;visibility:hidden;transform:translateY(-6px);transition:.35s var(--ease)}
.lang.open #lmenu{opacity:1;visibility:visible;transform:none}
#lmenu button{width:100%;text-align:start;background:none;border:0;color:var(--muted);padding:9px 12px;border-radius:10px;font:inherit;font-size:.9rem;cursor:pointer;transition:.25s}
#lmenu button:hover{background:rgba(212,163,80,.1);color:var(--ink)}
#lmenu button[aria-current=true]{color:var(--gold2)}

.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:120px var(--pad) 80px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:72px 72px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 30% 45%,#000,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 30% 45%,#000,transparent 75%);opacity:.7}
.orb{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
.o1{width:46vmax;height:46vmax;left:-12vmax;top:-10vmax;background:rgba(212,163,80,.22);animation:drift 22s ease-in-out infinite alternate}
.o2{width:34vmax;height:34vmax;right:-10vmax;bottom:-12vmax;background:rgba(240,194,116,.12);animation:drift 28s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate3d(6vmax,4vmax,0) scale(1.15)}}
.hero>:not(.orb){position:relative}
.hero .r{animation:rise 1.1s var(--ease) backwards;animation-delay:calc(var(--i)*.14s + .15s)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.hi{font:500 clamp(1.1rem,2.4vw,1.5rem) 'Space Grotesk',Inter,system-ui,sans-serif;color:var(--gold2);min-height:1.6em}
.hi::after{content:"";display:inline-block;width:2px;height:1em;background:var(--gold);margin-inline-start:4px;vertical-align:-.12em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
h1.mega{font-size:clamp(6rem,27vw,21rem);line-height:.85;letter-spacing:-.06em;font-weight:700;margin:.08em 0 .12em;margin-inline-start:-.04em;padding-bottom:.06em;background:linear-gradient(180deg,#fff 25%,#a29e90 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:34rem;color:var(--muted);font-size:clamp(1.02rem,1.8vw,1.2rem)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:1.6rem;margin-top:2.2rem}
.btn{display:inline-block;padding:14px 28px;border:1px solid var(--gold);border-radius:99px;color:var(--gold2);font-weight:500;transition:background .45s var(--ease),color .45s,box-shadow .45s var(--ease)}
.btn:hover{background:var(--gold);color:var(--void);box-shadow:0 0 36px rgba(212,163,80,.4)}
.tl{position:relative;color:var(--ink)}
.tl::after,.pl::after{content:"";position:absolute;left:0;bottom:-4px;height:1px;width:100%;background:var(--gold);transform:scaleX(.25);transform-origin:left;transition:transform .5s var(--ease)}
.tl:hover::after,.pl:hover::after{transform:scaleX(1)}

section.s{padding:clamp(88px,14vw,170px) var(--pad);max-width:1400px;margin:0 auto}
.s h2{font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.03em;line-height:1.1;font-weight:700}
.lead{color:var(--muted);max-width:32rem;margin-top:1rem}
.rv{opacity:0}
.rv.in{opacity:1;animation:rise .9s var(--ease) backwards;animation-delay:calc(var(--d,0)*80ms)}
.rv.in.nr{animation:none}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:3.5rem}
.acc,.proj{position:relative;border:1px solid var(--line);border-radius:22px;background:var(--panel);overflow:hidden;transition:transform .6s var(--ease),border-color .4s,box-shadow .6s var(--ease)}
.acc::before,.proj::before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(212,163,80,.16),transparent 60%);opacity:0;transition:opacity .4s;pointer-events:none}
.acc:hover::before,.proj:hover::before{opacity:1}
.acc{display:flex;flex-direction:column;justify-content:space-between;min-height:230px;padding:26px}
.acc:hover{transform:translateY(-8px);border-color:rgba(212,163,80,.5);box-shadow:0 24px 60px -24px rgba(212,163,80,.35)}
.ic{display:block;width:48px;height:48px;color:var(--gold2);transition:transform .6s var(--ease)}
.ic svg{width:100%;height:100%}
.acc:hover .ic{transform:scale(1.12) rotate(-5deg)}
.acc b{display:block;font:700 1.35rem 'Space Grotesk',Inter,system-ui,sans-serif}
.acc small{color:var(--muted);font-size:.95rem}
.go{position:absolute;top:24px;right:24px;width:20px;height:20px;color:var(--gold);opacity:0;transform:translate(-6px,6px);transition:.5s var(--ease)}
.acc:hover .go{opacity:1;transform:none}

.about p{max-width:36rem;color:#cfccc2;font-size:clamp(1.1rem,2vw,1.35rem);margin-top:1.5rem}
.likes{list-style:none;display:flex;flex-wrap:wrap;gap:.1em 1.3em;margin-top:3rem}

.likes:hover li{opacity:.28}
.likes:hover li:hover{opacity:1;color:var(--gold2)}

.gl{list-style:none;margin-top:3.5rem}
.gl li{display:flex;align-items:center;gap:1.2rem;padding:1.4rem 0;border-top:1px solid var(--line);font:500 clamp(1.2rem,3vw,2rem)/1.25 'Space Grotesk',Inter,system-ui,sans-serif;letter-spacing:-.02em;transition:padding .6s var(--ease),color .4s}
.gl li:last-child{border-bottom:1px solid var(--line)}
.gl li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(212,163,80,.2);transition:box-shadow .5s var(--ease),transform .5s var(--ease)}
.gl li:hover{padding-inline-start:1.2rem;color:var(--gold2)}
.gl li:hover::before{box-shadow:0 0 0 8px rgba(212,163,80,.15);transform:scale(1.2)}

.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;margin-top:3.5rem}
.proj{display:flex;flex-direction:column}
.proj:hover{transform:translateY(-6px);border-color:rgba(212,163,80,.45)}
.tw{overflow:hidden}
.thumb{aspect-ratio:16/9;display:grid;place-items:center;background:radial-gradient(circle at 25% 20%,rgba(212,163,80,.45),transparent 55%),linear-gradient(135deg,#1b1a1f,#0f0f13);font:700 clamp(3rem,8vw,5rem) 'Space Grotesk',Inter,system-ui,sans-serif;letter-spacing:-.05em;color:rgba(242,240,234,.9);transition:transform .9s var(--ease)}
img.thumb{display:block;width:100%;object-fit:cover}
.proj:hover .thumb{transform:scale(1.07)}
.pb{display:flex;flex-direction:column;gap:.8rem;padding:24px;flex:1}
.pb header{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.pb h3{font-size:1.4rem;letter-spacing:-.02em}
.pb p{color:var(--muted);font-size:.97rem}
.st{display:inline-flex;align-items:center;gap:.45rem;font-size:.82rem;color:var(--gold2);white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
.st[data-s=planned]{color:var(--muted)}
.st[data-s=planned]::before,.st[data-s=done]::before{animation:none}
@keyframes pulse{50%{opacity:.3}}
.tech{display:flex;flex-wrap:wrap;gap:.4rem}
.tech span{font-size:.8rem;color:var(--muted);border:1px solid var(--line);padding:2px 11px;border-radius:99px}
.pl{position:relative;margin-top:auto;padding-top:.6rem;width:fit-content;color:var(--gold2);font-size:.92rem}

.ft{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:1.2rem;padding:48px var(--pad);border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
.ft .logo{color:var(--ink)}
.fs{display:flex;gap:1.1rem}
.fs a{display:block;width:22px;height:22px;transition:color .3s,transform .4s var(--ease)}
.fs a:hover{color:var(--gold2);transform:translateY(-3px)}
.fs svg{width:100%;height:100%}

[dir=rtl] .menu a::after,[dir=rtl] .tl::after,[dir=rtl] .pl::after{left:auto;right:0;transform-origin:right}
[dir=rtl] .go{right:auto;left:24px;transform:translate(6px,6px)}

#dash{position:fixed;inset:0;z-index:200;background:var(--void);overflow:auto;display:none}
#dash.on{display:block}
.dh{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) var(--pad) 14px;background:rgba(10,10,13,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.dh h2{font-size:1.3rem}
#dmsg{color:var(--gold2);font-size:.88rem;flex:1 1 160px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{justify-content:space-between}
.dbt{background:none;border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:9px 18px;font:inherit;font-size:.88rem;cursor:pointer;white-space:nowrap;transition:.3s}
.dbt:hover{border-color:var(--gold)}
.dbt.pri{background:var(--gold);border-color:var(--gold);color:var(--void)}
.dtabs{display:flex;gap:8px;overflow-x:auto;padding:16px var(--pad)}
.dbody{padding:4px var(--pad) calc(120px + env(safe-area-inset-bottom,0px));max-width:880px}
.dc{display:grid;gap:14px;padding:20px;margin-bottom:14px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
#dash label{display:grid;gap:6px;font-size:.8rem;color:var(--muted)}
#dash input,#dash select,#dash textarea{width:100%;background:#0c0c10;border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:11px 13px;font:inherit;font-size:.95rem}
#dash input:focus,#dash select:focus,#dash textarea:focus{outline:none;border-color:var(--gold)}
#dash label.ck{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:.95rem}
#dash label.ck input{width:auto}
.imgf{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.imgf img{width:96px;height:54px;object-fit:cover;border-radius:8px}
.imgf input{flex:1 1 200px;width:auto}
.hint{color:var(--muted);font-size:.85rem;margin-bottom:14px}

@media(max-width:760px){
.burger{display:block}
.menu{position:absolute;top:100%;left:var(--pad);right:var(--pad);flex-direction:column;align-items:flex-start;gap:1.1rem;padding:22px;background:rgba(18,18,23,.96);border:1px solid var(--line);border-radius:18px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);opacity:0;visibility:hidden;transform:translateY(-8px);transition:.4s var(--ease)}
.nav.open .menu{opacity:1;visibility:visible;transform:none}
.rt{gap:.4rem}
}
@media(prefers-reduced-motion:reduce){
*,*::before,*::after{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
.rv{opacity:1}
}

bg.onclick=()=>bg.setAttribute('aria-expanded',nav.classList.toggle('open'));
$$('.menu a').forEach(a=>a.addEventListener('click',()=>{nav.classList.remove('open');bg.setAttribute('aria-expanded','false')}));
$$('.rv').forEach(el=>io.observe(el));
const links=$$('.menu a');
const spy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(l=>l.classList.toggle('on',l.getAttribute('href')==='#'+e.target.id))}),{rootMargin:'-45% 0px -50% 0px'});
$$('main section[id]').forEach(s=>spy.observe(s));
addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.acc,.proj');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')}},{passive:true});

/* ---------- owner dashboard (only appears for someone who can edit this artifact) ---------- */
const CL=window.claude&&window.claude.use?window.claude:null;
let D,tab='profile';
const TABS=[['profile','Profile'],['accounts','Accounts & links'],['likes','Interests'],['goals','Goals'],['projects','Projects'],['settings','Settings']];
const FIELDS={
accounts:[['n','Name'],['h','Handle'],['u','URL'],['i','Icon','sel',['yt','tt','ig','gh','ln']]],
likes:[['t','Interest','tr']],
goals:[['t','Goal','tr']],
projects:[['n','Name','tr'],['d','Description','tra'],['s','Status label','tr'],['k','Status type','sel',['active','planned','done']],['t','Technologies (comma separated)'],['u','Link URL'],['l','Link label','tr'],['m','Preview text (used when there is no image)'],['img','Preview image','img']]};
const NEW={accounts:()=>({n:'',h:'',u:'https://',i:'ln'}),likes:()=>({t:{en:''}}),goals:()=>({t:{en:''}}),
projects:()=>({n:{en:'New project'},d:{en:''},s:{en:'Planned'},k:'planned',t:'',u:'',l:{en:''},m:'+',img:''})};
const msg=t=>{const m=$('#dmsg');if(m)m.textContent=t};
function fld(o,f,x){const[k,l,t,op]=f,v=o[k],a=`data-k="${k}"${x}`;
if(t==='tr')return `<label>${l}<input ${a} data-t="tr" value="${esc(v&&v.en)}"></label>`;
if(t==='tra')return `<label>${l}<textarea ${a} data-t="tr" rows="4">${esc(v&&v.en)}</textarea></label>`;
if(t==='sel')return `<label>${l}<select ${a}>${op.map(y=>`<option${y===v?' selected':''}>${y}</option>`).join('')}</select></label>`;
if(t==='img')return `<label>${l}<span class="imgf">${v?`<img src="${esc(v)}" alt="">`:''}<input type="file" accept="image/*" ${a}>${v?`<button type="button" class="dbt" data-act="noimg"${x}>Remove</button>`:''}</span></label>`;
return `<label>${l}<input ${a} value="${esc(v)}"></label>`}
function draw(){
$('#dtabs').innerHTML=TABS.map(([k,l])=>`<button class="dbt${k===tab?' pri':''}" data-act="tab" data-k="${k}">${l}</button>`).join('');
let h='';
if(tab==='profile')h=`<div class="dc">${[['name','Name'],['intro','Homepage intro','tra'],['about','About me text','tra']].map(f=>fld(D,f,' data-l="_"')).join('')}</div><p class="hint">Edits are saved in English. Press "Translate with Claude" to fill the other nine languages.</p>`;
else if(tab==='settings')h=`<div class="dc">${fld(D,['lang','Default language (visitors can still switch)','sel',['auto',...LANGS.map(x=>x[0])]],' data-l="_"')}${['accounts','about','goals','projects'].map(s=>`<label class="ck"><input type="checkbox" data-sec="${s}"${D.show[s]?' checked':''}> Show the ${s} section</label>`).join('')}</div>`;
else h=D[tab].map((o,i)=>{const x=` data-l="${tab}" data-i="${i}"`,nm=o.n?(o.n.en||o.n):(o.t&&o.t.en)||'';
return `<div class="dc"><div class="row sp"><b>${esc(nm)||'New item'}</b><span class="row"><button class="dbt" data-act="up"${x}>↑</button><button class="dbt" data-act="dn"${x}>↓</button><button class="dbt" data-act="del"${x}>Delete</button></span></div>${FIELDS[tab].map(f=>fld(o,f,x)).join('')}</div>`}).join('')+`<button class="dbt" data-act="add" data-l="${tab}">+ Add</button>`;
$('#dbody').innerHTML=h}
function openDash(){D=JSON.parse(JSON.stringify(S));const el=$('#dash');
el.innerHTML=`<div class="dh"><h2>Dashboard</h2><span id="dmsg"></span><div class="row"><button class="dbt" data-act="tr">Translate with Claude</button><button class="dbt" data-act="close">Close</button><button class="dbt pri" data-act="save">Save &amp; publish</button></div></div><div class="dtabs" id="dtabs"></div><div class="dbody" id="dbody"></div>`;
el.classList.add('on');document.body.style.overflow='hidden';draw()}
function closeDash(){$('#dash').classList.remove('on');document.body.style.overflow=''}
function shrink(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,960/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};im.src=fr.result};fr.readAsDataURL(f)})}
async function upd(e){const t=e.target;
if(t.dataset.sec){D.show[t.dataset.sec]=t.checked;return}
const k=t.dataset.k,l=t.dataset.l;if(k===undefined||l===undefined)return;
const o=l==='_'?D:D[l][+t.dataset.i];
if(t.type==='file'){if(e.type==='change'&&t.files[0]){msg('Processing image…');o[k]=await shrink(t.files[0]);msg('');draw()}return}
o[k]=t.dataset.t==='tr'?{en:t.value}:t.value}
const HEAD=n=>`<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ace | ${esc(n)}</title><meta name="description" content="Ace is a personal home on the internet: accounts, interests, projects and goals."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">`;
const buildDoc=d=>'<!DOCTYPE html>\n<html lang="en">\n<head>'+HEAD(d.name)+'<style id="css">'+$('#css').textContent+'</style></head>\n<body>\n<script id="shell" type="text/html">'+$('#shell').textContent+'<\/script>\n<script id="data" type="application/json">'+JSON.stringify(d).replace(/</g,'\\u003c')+'<\/script>\n<script id="app">'+$('#app').textContent+'<\/script>\n</body>\n</html>';
async function save(){
const a=CL&&await CL.use('artifact');if(!a)return msg('Saving is not available in this view.');
try{msg('Publishing…');await a.publish(buildDoc(D))}
catch(e){const c=e&&e.code;msg(c==='conflict'?'A newer version was published. Reloading…':(c==='not_writer'||c==='not_granted')?'Only the owner can publish changes.':'Could not publish ('+(c||'error')+').')}}
async function translate(){
const sm=CL&&await CL.use('sample');if(!sm)return msg('Translation is not available in this view.');
const all=[],add=o=>{if(o&&o.en&&!o.fr)all.push(o)};
add(D.intro);add(D.about);D.likes.forEach(x=>add(x.t));D.goals.forEach(x=>add(x.t));D.projects.forEach(p=>{add(p.n);add(p.d);add(p.s);add(p.l)});
if(!all.length)return msg('Everything is already translated.');
msg('Translating…');
try{const r=await sm.json('Translate each English string in the JSON array into ar, ja, fr, es, de, zh (Simplified Chinese), ru, tr, ko. Keep names and technical terms (C, C++, GitHub) unchanged. Reply with ONLY a JSON array of the same length and order, each item an object with the keys ar, ja, fr, es, de, zh, ru, tr, ko. Strings: '+JSON.stringify(all.map(o=>o.en)));
all.forEach((o,i)=>Object.assign(o,r[i]));msg('Translated. Review, then publish.');draw()}
catch(e){msg('Translation failed ('+((e&&e.code)||'error')+').')}}
$('#dash').addEventListener('input',upd);$('#dash').addEventListener('change',upd);
$('#dash').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,l=b.dataset.l,i=+b.dataset.i;
if(a==='tab'){tab=b.dataset.k;draw()}
else if(a==='add'){D[l].push(NEW[l]());draw()}
else if(a==='del'){D[l].splice(i,1);draw()}
else if(a==='up'&&i>0){D[l].splice(i-1,0,D[l].splice(i,1)[0]);draw()}
else if(a==='dn'&&i<D[l].length-1){D[l].splice(i+1,0,D[l].splice(i,1)[0]);draw()}
else if(a==='noimg'){D[l][i].img='';draw()}
else if(a==='save')save();else if(a==='tr')translate();else if(a==='close')closeDash()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeDash()});
function ownerReady(){$('#dnav').hidden=false;$('#dlink').onclick=e=>{e.preventDefault();nav.classList.remove('open');openDash()};if(location.hash==='#dashboard')openDash()}
if(CL)CL.use('user').then(u=>{if(u&&(u.isOwner()||u.canEdit()))ownerReady()}).catch(()=>{});
</script>
</body>
</html>
